[project]
name = "finsight-insights-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi>=0.141.1",
    "google-genai>=2.20.0",
    "httpx>=0.28.1",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.4",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pypdf>=6.16.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
